<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4;}
.sidebar{
width:220px;height:100vh;background:#007bff;
position:fixed;color:white;padding:20px;
}
.sidebar a{
display:block;padding:10px;margin:5px 0;
background:rgba(255,255,255,0.1);
cursor:pointer;color:white;
}
.sidebar a:hover{background:white;color:#007bff;}
.content{margin-left:250px;padding:20px;}
.claim{background:#fff;padding:10px;margin:10px 0;}
button{padding:8px;margin:5px;}
input{padding:8px;margin:5px;}
</style>

</head>

<body>

<div class="sidebar">
<h3>💼 System</h3>
<a onclick="showDashboard()">Dashboard</a>
<a onclick="showClaims()">Claims</a>
</div>

<div class="content" id="main"></div>

<script>

const API="https://takaful-backend-rqmn.onrender.com";

let user=JSON.parse(localStorage.getItem("user"));

if(!user){
window.location.href="index.html";
}

function showDashboard(){
document.getElementById("main").innerHTML=
`<h2>Welcome ${user.username}</h2>
<p>Role: ${user.role}</p>`;
}

function showClaims(){
fetch(API+"/claims?user="+(user.role==="client"?user.username:""))
.then(res=>res.json())
.then(data=>{

let html="<h2>Claims</h2>";
html+=`<input id="title" placeholder="Title"><br>
<input id="desc" placeholder="Description"><br>
<button onclick="addClaim()">Add Claim</button><hr>`;

data.forEach(c=>{
html+=`<div class="claim">
<b>${c.title}</b><br>
${c.description}<br>
Status: ${c.status}<br>`;
    
if(user.role==="admin"||user.role==="supervisor"){
html+=`<button onclick="updateStatus(${c.id},'Approved')">✅ Approve</button>`;
}

if(user.role==="admin"||user.role==="officer"){
html+=`<button onclick="updateStatus(${c.id},'Rejected')">❌ Reject</button>`;
}

html+=`</div>`;
});

document.getElementById("main").innerHTML=html;
});
}

function addClaim(){
let title=document.getElementById("title").value;
let desc=document.getElementById("desc").value;

fetch(API+"/addClaim",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
title,
desc,
username:user.username
})
}).then(()=>showClaims());
}

function updateStatus(id,status){
fetch(API+"/updateStatus",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id,status})
}).then(()=>showClaims());
}

showDashboard();

</script>

</body>
</html>
