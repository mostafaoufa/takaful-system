<!DOCTYPE html>
<html>
<head>
    <title>TAKAFUL ERP SYSTEM</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:100px;
            background:#eee;
        }
        input{
            padding:10px;
            margin:5px;
            width:200px;
        }
        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h2>Login</h2>

<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>

<script>

const API = "https://takaful-backend-rqmn.onrender.com";

function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    fetch(API + "/login", {
        method: "POST",
        headers: {
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(JSON.stringify(data));  // ✅ مهم جدًا نعرف الرد

        if(data.ok){
            alert("✅ Login Success");
        }else{
            alert("❌ Login Failed");
        }
    })
    .catch(err => {
        alert("❌ ERROR: " + err);
    });

}

</script>

</body>
</html>
